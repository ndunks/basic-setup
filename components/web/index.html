<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smarthome</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style type="text/css">
    /* SLIDER LOADER */
    .loading {
      position: fixed;
      width: 100%;
      height: 5px;
      top: 0px;
      overflow-x: hidden;
      z-index: 99999;
    }

    .loading.hide {
      display: none;
    }

    .line {
      position: absolute;
      opacity: 0.4;
      background: #ffffff;
      width: 100%;
      height: 5px;
    }

    .subline {
      position: absolute;
      background: #e4a805;
      height: 5px;
    }

    .inc {
      animation: increase 1s infinite linear;
    }

    @keyframes increase {
      from {
        left: -10%;
        width: 10%;
      }

      to {
        left: 100%;
        width: 60%;
      }
    }
  </style>
</head>

<body>
  <div id="loading" class="loading hide">
    <div class="line"></div>
    <div class="subline inc"></div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
